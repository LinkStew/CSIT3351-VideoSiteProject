<!DOCTYPE html>

<html>
<title>Blockbuster Sign-Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="blockbuster.css">

<body class="loginBG">


    <div style="background-color: #FFA903">
        <nav class="navbar">

            <div class="nav-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Blockbuster_logo.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
                    alt="Blockbuster Logo">
            </div>

            <div class="account-links">
                <a href="login-page.html">Login/Sign Up</a>
            </div>

        </nav>
    </div>


    
    <div class="login-parent">
        <div class="login-box">
          <div class="SU-Heading">
            <h1>Welcome to BlockBuster!</h1>
            <h3>Fill out the following fields to sign up and start browsing:</h3>
          </div>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your Name" required>
            <label for="email">Email Address:</label>
            <input type="text" id="email" name="email" placeholder="Enter your Email" required>
            <label for="password">Create a password:</label>
            <input type="password" id="password" name="password" placeholder="Create Password" required>
            <label for="cpassword">Confirm password:</label>
            <input type="password" id="cpassword" name="cpassword" placeholder="Confirm Password" required>
            <button id="signupbutton"> Sign-Up! </button>
            <a href="login-page.html">Log In?</a>
          </div>
        </div>
        
    </div>


<footer>
  <p>Copyright &copy; Blockbuster</p>
  <a href="home-page.html">Super secret admin bypass link</a>
</footer>

<script src="blockbuster.js"></script>
</body>
</html>
