<!DOCTYPE html>

<html>
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">


<style>
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background-color: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .nav-links {
    display: flex;
    gap: 20px;
    flex: 1; 
  }
  .nav-left {
    padding-right: 50px;
    justify-content: flex-end;
  }
  .nav-right {
    padding-left: 50px;
    justify-content: flex-start;
  }
  .nav-links a {
    text-decoration: none;
    color: #333;
    font-size: 35px;
  }
  .login-parent {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 30vh;
  }
  .login-box {
    padding: 30px;
    border-radius: 0px;
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    justify-content: center;
    align-items: center;
    background-color: #FFA903;
  }
  .nav-links a:hover {
    background-color:#0e3fa9;
    color: #FFA903;
    font-size: 35px;
  }
  .nav-logo img {
    width: 175px; 
    display: block;
  }
  .movie-grid{
    display: grid;
    grid-template-columns: 250px 250px 250px 250px;
    column-gap: 50px;
    justify-content: center;
    padding:50px;
    
  }
  .glow-box {
    display: grid;
    grid-template-rows: auto;
    padding-top: 10px;
    padding-bottom: 15px;
    border-radius: 8px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .glow-box:hover {
    padding-top: 10px;
    background-color: #FFA903;
    transform: scale(1.2);
    box-shadow: 0 0 20px 5px rgb(255, 252, 88);
  }
  .about-us{
    align-items: center;
  }
  footer{
    display:grid;
    grid-template-columns:auto auto auto;
  }
  div,p,button{
      color: black;
      font-family: Open Sans;
      font-size: 20px;
      text-align: center;
  }
</style>
